# Default fees. Every one is editable by the user; these are the starting values.
# label and note are shown on screen, so they are in Spanish.
#
# Each fee carries where its value comes from:
#   source_url   the page the value was read from; for a user_defined fee, the reference price
#                the fee applies to
#   verified_at  when it was last checked against that page (for user_defined, when the reference
#                price was checked)
#   status       verified: the source states this value, or it was observed on the operation's
#                own screen (the note says when and with which amounts)
#                pending: an estimate (a cap, a range, a contradiction, or an assumption no source
#                confirms); shown as such
#                user_defined: no source can give it; the user sets it
#   upper_bound  pending fees only: the source only gives a cap ("up to X") and X is the default
#
# kind: fixed   -> value + currency
# kind: percent -> value in percent (0.6 means 0.6 %), optional minimum {amount, currency}

fees:
  # --- Payoneer -> Binance (card or P2P) -> Bitso -> bank ------------------------------------

  - id: binance_card_purchase
    label: Comisión de Binance por comprar con tarjeta
    kind: percent
    value: 2
    status: verified
    verified_at: 2026-09-25
    source_url: https://www.binance.com/en/blog/fiat/can-you-buy-cryptocurrency-with-a-credit-card-421499824684903691
    note: >-
      Binance dice "hasta alrededor de 2 %". Observado el 25/09/2026 en la pantalla final de
      pago, antes de confirmar la compra: 0,20 USD con 10 USD y 2,00 USD con 100 USD. Si tu
      pantalla final muestra otra comisión, poné la tuya. Payoneer debitó exactamente el monto en
      USD cargado en Binance (observado el 25/09/2026): la tarjeta no suma cargos.

  - id: payoneer_p2p_transfer
    label: Transferencia de Payoneer al comprador P2P
    kind: fixed
    value: 4.00
    currency: USD
    upper_bound: true
    status: pending
    verified_at: 2026-09-23
    source_url: https://www.payoneer.com/pricing/
    note: >-
      Hasta 4,00 USD si las dos cuentas son del mismo país; hasta 1 % más hasta 4,00 USD si son
      de países distintos.

  - id: p2p_premium
    label: Recargo P2P por pagar con Payoneer
    kind: percent
    value: 0
    status: user_defined
    verified_at: 2026-09-23
    source_url: https://docs.criptoya.com/argentina/
    note: >-
      El precio P2P en vivo no filtra por medio de pago y no se encontraron ofertas públicas que
      acepten Payoneer. Poné cuánto más pagás realmente sobre ese precio.

  - id: binance_p2p_taker
    label: Comisión taker de Binance P2P
    kind: fixed
    value: 0.08
    currency: USDT
    upper_bound: true
    status: pending
    verified_at: 2026-09-23
    source_url: https://www.binance.com/en/support/announcement/detail/70c92ace9acb45529cd4541195248c91
    note: Entre 0,06 y 0,08 USDT por orden; el anuncio no dice cuál corresponde a USD.

  - id: binance_withdrawal_polygon
    label: Retiro de USDT de Binance por Polygon
    kind: fixed
    value: 0.07
    currency: USDT
    status: verified
    verified_at: 2026-09-23
    source_url: https://www.binance.com/bapi/capital/v1/public/capital/getNetworkCoinAll
    note: Es la red más barata que acepta Bitso. Binance cambia esta comisión seguido.

  - id: bitso_usdt_deposit
    label: Depósito de USDT en Bitso
    kind: fixed
    value: 0
    currency: USDT
    status: verified
    verified_at: 2026-09-23
    source_url: https://bitso.com/ar/fees/transactions

  - id: bitso_taker
    label: Comisión taker del libro de órdenes de Bitso
    kind: percent
    value: 0.60
    status: verified
    verified_at: 2026-09-23
    source_url: https://bitso.com/ar/fees
    note: >-
      Nivel base, con menos de ARS 1.625.000 de volumen en 30 días; en niveles más altos baja
      hasta 0,15 %.

  - id: bitso_ars_withdrawal
    label: Retiro de ARS de Bitso a CBU/CVU
    kind: fixed
    value: 0
    currency: ARS
    status: verified
    verified_at: 2026-09-23
    source_url: https://bitso.com/ar/fees/transactions

  # --- Payoneer -> ARQ (formerly DolarApp) -> bank -------------------------------------------

  - id: payoneer_us_withdrawal
    label: Retiro de Payoneer a una cuenta de EE.UU.
    kind: percent
    value: 4
    minimum:
      amount: 20.00
      currency: USD
    upper_bound: true
    status: pending
    verified_at: 2026-09-23
    source_url: https://www.payoneer.com/pricing/
    note: >-
      Entre 1,2 % y 4 % para titulares argentinos, con un mínimo de hasta 20,00 USD. Los valores
      exactos solo se ven dentro de la cuenta; si no te cobran mínimo, ponelo en 0.

  - id: arq_ach_deposit
    label: Recepción de ACH en ARQ
    kind: fixed
    value: 3.00
    currency: USD
    status: verified
    verified_at: 2026-09-23
    source_url: https://help.arqfinance.com/es/articles/13532861-cuenta-sin-fronteras-recarga-en-multiples-monedas

  - id: arq_usd_usdc_conversion
    label: Conversión USD→USDc en ARQ
    kind: percent
    value: 0
    upper_bound: false
    status: pending
    verified_at: 2026-09-23
    source_url: https://help.arqfinance.com/es/articles/13901700-recargar-mi-cuenta-con-dolares-usd
    note: >-
      ARQ acredita los USD que llegan por ACH directamente como USDc, pero no publica la tasa
      de esa conversión y no se encontró ningún spread documentado. La única comisión publicada
      para depósitos en USD es la fija de 3 USDc, en el plan Standard (https://help.arqfinance.com/es/articles/16785194-costes-y-comisiones-de-arq-argentina);
      los términos dicen "al valor equivalente en Dólares Digitales", sin dar la tasa
      (https://www.arqfinance.com/es-AR/legal/terminos_y_condiciones_cuenta_global_arg, punto 3.1).

  - id: arq_ars_withdrawal
    label: Retiro de ARS de ARQ a CBU
    kind: fixed
    value: 0
    currency: ARS
    status: verified
    verified_at: 2026-09-23
    source_url: https://help.arqfinance.com/es/articles/13532861-cuenta-sin-fronteras-recarga-en-multiples-monedas

  # --- Payoneer -> USD bank account -> MEP -----------------------------------------------------

  - id: payoneer_ar_withdrawal
    label: Retiro de Payoneer a una cuenta argentina en USD
    kind: percent
    value: 2
    upper_bound: true
    status: pending
    verified_at: 2026-09-23
    source_url: https://www.payoneer.com/es/resources/estrategias-para-usar-y-mover-tus-fondos-en-argentina/
    note: >-
      "Hasta 2 %" según esta página; otra página de Payoneer dice 3,3 % de punta a punta para
      Santander (https://pages.payoneer.com/es/withdrawal-of-funds/).

  - id: bank_usd_credit
    label: Comisión del banco por acreditar la transferencia
    kind: fixed
    value: 0
    currency: USD
    status: verified
    verified_at: 2026-09-23
    source_url: https://www.bcra.gob.ar/Pdfs/comytexord/A8481.pdf
    note: Los bancos no pueden cobrar por estas operaciones (vigente desde el 15/09/2026).

  - id: broker_buy
    label: Comisión del broker, compra de AL30D
    kind: percent
    value: 0.05
    upper_bound: true
    status: pending
    verified_at: 2026-09-23
    source_url: https://balanz.com/comisiones/
    note: Balanz, "hasta 0,05 %" en bonos soberanos. Depende de tu broker o banco.

  - id: broker_sell
    label: Comisión del broker, venta de AL30
    kind: percent
    value: 0.05
    upper_bound: true
    status: pending
    verified_at: 2026-09-23
    source_url: https://balanz.com/comisiones/
    note: Balanz, "hasta 0,05 %" en bonos soberanos. Depende de tu broker o banco.

  - id: byma_buy
    label: Derechos de mercado BYMA, compra de AL30D
    kind: percent
    value: 0.01
    status: verified
    verified_at: 2026-09-23
    source_url: https://cdn.prod.website-files.com/6697a441a50c6b926e1972e0/6a2875749a418f0439d7de8f_BYMA-Derechos-Mercado-sobre-Operaciones_2026-06-09.pdf
    note: Se cobra en cada punta de la operación MEP.

  - id: byma_sell
    label: Derechos de mercado BYMA, venta de AL30
    kind: percent
    value: 0.01
    status: verified
    verified_at: 2026-09-23
    source_url: https://cdn.prod.website-files.com/6697a441a50c6b926e1972e0/6a2875749a418f0439d7de8f_BYMA-Derechos-Mercado-sobre-Operaciones_2026-06-09.pdf
    note: Se cobra en cada punta de la operación MEP.
