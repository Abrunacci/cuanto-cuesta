# Routes from USD in Payoneer to ARS in a bank account, as ordered steps.
#
# Within a step: percent fees and fixed fees in the step's input currency are charged first,
# then the conversion (if any), then fixed fees in the conversion's target currency.
# The rate side (bid or ask) follows from the direction of the conversion.
# Fee ids refer to fees.yaml; every fee there must be used by some route.
# name, label and warnings are shown on screen, so they are in Spanish. A warning may link a
# phrase with [text](url).

routes:
  - id: binance_bitso
    name: Binance P2P + Bitso
    source: USD
    target: ARS
    warnings:
      - >-
        El precio P2P es el de la oferta genérica USDT/USD, no el de avisos que acepten Payoneer.
    steps:
      - label: Vender USD por USDT en Binance P2P
        fees: [payoneer_p2p_transfer, p2p_premium, binance_p2p_taker]
        conversion: {rate: p2p_usdt_usd, to: USDT}
      - label: Retirar USDT a Bitso por Polygon
        fees: [binance_withdrawal_polygon, bitso_usdt_deposit]
      - label: Vender USDT por ARS en Bitso
        fees: [bitso_taker]
        conversion: {rate: bitso_usdt_ars, to: ARS}
      - label: Retirar ARS al banco
        fees: [bitso_ars_withdrawal]

  - id: arq
    name: ARQ (ex DolarApp)
    source: USD
    target: ARS
    steps:
      - label: Retirar de Payoneer a ARQ
        fees: [payoneer_us_withdrawal]
      - label: ARQ recibe la transferencia ACH
        fees: [arq_ach_deposit, arq_usd_usdc_conversion]
      - label: Convertir USDc a ARS en ARQ
        conversion: {rate: arq_usd_ars, to: ARS}
      - label: Retirar ARS al banco
        fees: [arq_ars_withdrawal]

  - id: mep
    name: Dólar MEP
    source: USD
    target: ARS
    warnings:
      - >-
        [Verificá las restricciones sobre el dólar MEP](https://www.bcra.gob.ar/Pdfs/comytexord/A8481.pdf)
    steps:
      - label: Retirar de Payoneer a una cuenta argentina en USD
        fees: [payoneer_ar_withdrawal]
      - label: El banco acredita la transferencia
        fees: [bank_usd_credit]
      - label: Comprar AL30D y vender AL30
        fees: [broker_buy, broker_sell, byma_buy, byma_sell]
        conversion: {rate: mep, to: ARS}
